<div class="attribute-dropdown" [class.open]="isOpen">
  <button type="button" class="attribute-selected" [class.placeholder]="!selectedValue" (click)="toggleDropdown($event)">
    <span class="attribute-name text-no-overflow" [style.color]="selectedColor()">{{ selectedValue || placeholder }}</span>
    <i class="fa fa-chevron-down"></i>
  </button>

  <div class="attribute-options" *ngIf="isOpen" (click)="$event.stopPropagation()">
    <div class="attribute-search-wrapper">
      <input type="text" class="attribute-search-input" placeholder="Filter..." [(ngModel)]="filterValue" #searchInput />
      <button *ngIf="filterValue" type="button" class="attribute-clear-btn" (click)="clearFilter($event)">
        <i class="fa fa-times"></i>
      </button>
    </div>

    <div class="attribute-options-list">
      <button
        *ngIf="filterValue === ''"
        type="button"
        class="attribute-option"
        [class.selected]="!selectedValue"
        (click)="selectOption(null, $event)"
      >
        Any / Detault
      </button>
      <button
        type="button"
        class="attribute-option"
        *ngFor="let option of filteredOptions"
        [class.selected]="option === selectedValue"
        [style.color]="optionColorFor(option)"
        (click)="selectOption(option, $event)"
      >
        {{ option }}
      </button>
      <div *ngIf="filteredOptions.length === 0" class="attribute-no-match">No matches found</div>
    </div>
  </div>
</div>
